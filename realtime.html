<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체다 실시간 성과</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.6 Pretendard,system-ui,sans-serif;background:#f1f5f9;color:#111827;min-height:100vh}
  #gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:24px}
  #gate h2{font-size:18px;color:#111827}
  #gate input{width:260px;padding:10px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;outline:none}
  #gate button{padding:10px 28px;background:#111827;color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer}
  #gate .err{color:#dc2626;font-size:13px}
  #app{display:none;padding:16px;max-width:600px;margin:0 auto}
  .header{text-align:center;padding:16px 0 20px;color:#6b7280;font-size:13px}
  .header strong{display:block;font-size:20px;color:#111827;margin-bottom:4px}
  .card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px #0000000d}
  .card-title{font-size:15px;font-weight:700;color:#111827;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #f1f5f9}
  .row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
  .row .label{color:#374151}
  .row .val{font-weight:600;color:#111827}
  .sub-row{display:flex;justify-content:space-between;padding:2px 0 2px 14px;font-size:13px}
  .sub-row .label{color:#9ca3af}
  .sub-row .val{color:#6b7280}
  .divider{height:1px;background:#f3f4f6;margin:8px 0}
  .roas-good{color:#15803d}
  .roas-bad{color:#dc2626}
  .refund{color:#9ca3af;font-size:12px}
  .footer{text-align:center;color:#9ca3af;font-size:12px;padding:16px 0 32px}
  button.refresh{display:block;margin:0 auto 16px;padding:8px 20px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;cursor:pointer;color:#374151}
</style>
</head>
<body>

<div id="gate">
  <h2>🧀 체다 실시간 성과</h2>
  <input id="pw" type="password" placeholder="비밀번호" autofocus>
  <button onclick="unlock()">열기</button>
  <div class="err" id="err"></div>
</div>

<div id="app">
  <div class="header"><strong>🧀 체다 실시간 성과</strong><span id="asof"></span></div>
  <button class="refresh" onclick="refresh_()">↻ 새로고침</button>
  <div id="cards"></div>
  <div class="footer">체다팀 내부용 · <span id="asof2"></span></div>
</div>

<script>
const W = n => Number(n||0).toLocaleString('ko-KR');
const pct = (a,b) => b ? Math.round(a/b*100)+'%' : '—';
const DAYS = ['일','월','화','수','목','금','토'];
const BRANDS = ['graniesalad','basetune','hattke','salagris'];

async function decryptBlob(pw, b64){
  const raw = Uint8Array.from(atob(b64.trim()), c=>c.charCodeAt(0));
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function load(){
  const pw = sessionStorage.getItem('rt_pw');
  if(!pw) throw new Error('nopw');
  const b64 = await (await fetch('data/data.enc?_='+Date.now())).text();
  return decryptBlob(pw, b64);
}

async function unlock(){
  const pw = document.getElementById('pw').value.trim();
  if(!pw) return;
  sessionStorage.setItem('rt_pw', pw);
  try {
    const d = await load();
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    render(d);
  } catch(e){
    sessionStorage.removeItem('rt_pw');
    document.getElementById('err').textContent='비밀번호가 다릅니다';
  }
}

async function refresh_(){
  try { render(await load()); } catch(e){}
}

// URL 파라미터로 비밀번호 자동입력
(function(){
  const p = new URLSearchParams(location.search).get('pw');
  if(p){ sessionStorage.setItem('rt_pw',''); sessionStorage.setItem('rt_pw',p); document.getElementById('pw').value=p; unlock(); }
  else if(sessionStorage.getItem('rt_pw')){ unlock(); }
})();

function render(d){
  const at = d.at || '';
  const dateStr = d.date || '';
  const dt = new Date(at);
  const dow = DAYS[dt.getDay()];
  const hhmm = at.slice(11,16);
  const yy = dateStr.slice(2,4)+'/'+dateStr.slice(5,7)+'/'+dateStr.slice(8,10);
  const label = `${yy} (${dow}) ${hhmm}`;
  document.getElementById('asof').textContent = label;
  document.getElementById('asof2').textContent = label + ' 기준';

  const cards = document.getElementById('cards');
  cards.innerHTML = '';

  for(const bk of BRANDS){
    const v = (d.brands||{})[bk];
    if(!v) continue;

    const cafe=v.cafe24Sales||0, cp=v.coupang1Sales||0, ss=v.ss1Sales||0;
    const cafeN=v.cafe24Orders||0, cpN=v.coupang1Orders||0, ssN=v.ss1Orders||0;
    const cafe2=v.cafe24V2Sales||0, cp2=v.coupang1V2Sales||0;
    const cafeRef=v.cafe24Refund||0, cpRef=v.coupang1Refund||0, ssRef=v.ss1Refund||0;
    const meta=v.meta||0, google=v.google||0, tiktok=v.tiktok||0;
    const gfa=v.gfa||0, kakao=v.kakao||0, nsa=v.naversa||0;
    const ad = meta+google+tiktok+gfa+kakao+nsa;
    const salesB = cafe+cp+ss;
    const salesA = cafe2+cp2+ss;
    const ordersB = cafeN+cpN+ssN;
    const roasB = ad ? Math.round(salesB/ad*100) : 0;
    const roasA = ad ? Math.round(salesA/ad*100) : 0;
    const cpa = ordersB ? Math.round(ad/ordersB) : 0;
    const aov = ordersB ? Math.round(salesB/ordersB) : 0;
    const cafePct = salesB ? Math.round(cafe/salesB*100) : 0;
    const roasClass = roasA>=200?'roas-good':roasA<100?'roas-bad':'';

    const adSubs = [
      meta   ? `<div class="sub-row"><span class="label">◦ 메타</span><span class="val">${W(meta)}</span></div>` : '',
      google ? `<div class="sub-row"><span class="label">◦ 구글</span><span class="val">${W(google)}</span></div>` : '',
      tiktok ? `<div class="sub-row"><span class="label">◦ 틱톡</span><span class="val">${W(tiktok)}</span></div>` : '',
      gfa    ? `<div class="sub-row"><span class="label">◦ GFA</span><span class="val">${W(gfa)}</span></div>` : '',
      kakao  ? `<div class="sub-row"><span class="label">◦ 카카오</span><span class="val">${W(kakao)}</span></div>` : '',
      nsa    ? `<div class="sub-row"><span class="label">◦ 네이버SA</span><span class="val">${W(nsa)}</span></div>` : '',
    ].join('');

    const refPct = cafeRef ? ` <span class="refund">(환불 ${W(cafeRef)}원)</span>` : '';
    const cpRefPct = cpRef ? ` <span class="refund">(환불 ${W(cpRef)}원)</span>` : '';

    const html = `
<div class="card">
  <div class="card-title">${v.label} · ${dateStr.slice(5)} (${dow}) ${hhmm}</div>

  <div class="row"><span class="label">• 광고비</span><span class="val">${W(ad)}</span></div>
  ${adSubs}

  <div class="divider"></div>

  <div class="row"><span class="label">• 매출 / ${W(ordersB)}건 (환불 전)</span><span class="val">${W(salesB)}</span></div>
  <div class="sub-row"><span class="label">◦ 자사몰</span><span class="val">${W(cafe)} / ${cafeN}건</span></div>
  <div class="sub-row"><span class="label">◦ 쿠팡</span><span class="val">${W(cp)} / ${cpN}건</span></div>
  <div class="sub-row"><span class="label">◦ 스마트스토어</span><span class="val">${W(ss)} / ${ssN}건</span></div>

  ${cafeRef||cpRef||ssRef ? `
  <div class="divider"></div>
  <div class="row"><span class="label">• 매출 (환불 후)</span><span class="val">${W(salesA)}</span></div>
  <div class="sub-row"><span class="label">◦ 자사몰</span><span class="val">${W(cafe2)}${refPct}</span></div>
  <div class="sub-row"><span class="label">◦ 쿠팡</span><span class="val">${W(cp2)}${cpRefPct}</span></div>
  ` : ''}

  <div class="divider"></div>
  <div class="row"><span class="label">• ROAS (환불 전/후)</span><span class="val ${roasClass}">${roasB}% / ${roasA}%</span></div>
  <div class="row"><span class="label">• CPA</span><span class="val">${W(cpa)}</span></div>
  <div class="row"><span class="label">• 객단가</span><span class="val">${W(aov)}</span></div>
  <div class="row"><span class="label">• 결제 비율</span><span class="val">자사몰 ${cafePct}% / 외 ${100-cafePct}%</span></div>
</div>`;
    cards.insertAdjacentHTML('beforeend', html);
  }
}

document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
</script>
</body>
</html>
